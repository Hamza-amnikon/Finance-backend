name: Deploy Finance Backend to IIS

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: finance-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and publish backend APIs on SWVMNVMNPDDEP01
    runs-on: [self-hosted, Windows, X64, finance-backend-deploy]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore .NET solution
        run: |
          $dotnet = 'C:\ProgramData\SparkFinance\BuildSdk\dotnet.exe'
          if (-not (Test-Path -LiteralPath $dotnet)) {
            throw "Expected .NET SDK was not found at $dotnet"
          }

          & $dotnet restore (Join-Path $env:GITHUB_WORKSPACE 'SparkFinanceBackend.slnx')
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed with exit code $LASTEXITCODE"
          }

      - name: Publish all IIS API projects
        run: |
          $dotnet = 'C:\ProgramData\SparkFinance\BuildSdk\dotnet.exe'
          $sourceRoot = $env:GITHUB_WORKSPACE
          $outputRoot = Join-Path $env:RUNNER_TEMP 'finance-backend-release'
          $expected = @(
            'AccountingService.API',
            'BankingService.API',
            'BillService.API',
            'ClientService.API',
            'DashboardService.API',
            'ExchangeRateService.API',
            'ExpenseService.API',
            'PaymentMadeService.API',
            'PurchaseOrderService.API',
            'RoleService.API',
            'PermissionService.API',
            'SalesEstimateService.API',
            'SalesInvoiceService.API',
            'VendorCreditService.API',
            'VendorService.API'
          )

          $projects = Get-ChildItem -LiteralPath $sourceRoot -Directory |
            Where-Object { $_.Name -like '*.API' } |
            Sort-Object -Property Name

          if ($projects.Count -lt $expected.Count) {
            throw "Expected at least $($expected.Count) API projects, found $($projects.Count)."
          }

          foreach ($name in $expected) {
            if (-not ($projects.Name -contains $name)) {
              throw "Expected API project $name was not found."
            }

            $projectFile = Join-Path (Join-Path $sourceRoot $name) "$name.csproj"
            if (-not (Test-Path -LiteralPath $projectFile)) {
              throw "Project file was not found: $projectFile"
            }

            $projectOutput = Join-Path $outputRoot $name
            New-Item -ItemType Directory -Path $projectOutput -Force | Out-Null
            & $dotnet publish $projectFile --configuration Release --no-restore --output $projectOutput
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet publish failed for $name with exit code $LASTEXITCODE"
            }

            if (-not (Test-Path -LiteralPath (Join-Path $projectOutput "$name.dll"))) {
              throw "Published assembly for $name was not found."
            }
          }

      - name: Verify publish folders and protected configuration
        run: |
          if ($env:COMPUTERNAME -ine 'SWVMNVMNPDDEP01') {
            throw "Refusing to deploy from unexpected host: $env:COMPUTERNAME"
          }

          $publishRoot = 'C:\ProgramData\SparkFinance\publish'
          $services = @(
            'AccountingService.API',
            'BankingService.API',
            'BillService.API',
            'ClientService.API',
            'DashboardService.API',
            'ExchangeRateService.API',
            'ExpenseService.API',
            'PaymentMadeService.API',
            'PurchaseOrderService.API',
            'RoleService.API',
            'PermissionService.API',
            'SalesEstimateService.API',
            'SalesInvoiceService.API',
            'VendorCreditService.API',
            'VendorService.API'
          )

          foreach ($service in $services) {
            $target = Join-Path $publishRoot $service
            if (-not (Test-Path -LiteralPath $target -PathType Container)) {
              throw "Publish folder was not found for $service."
            }
            if (-not (Test-Path -LiteralPath (Join-Path $target 'web.config')) -or
                -not (Test-Path -LiteralPath (Join-Path $target 'appsettings.json'))) {
              throw "Protected IIS or appsettings configuration is missing for $service."
            }
          }

      - name: Publish backend services with rollback
        run: |
          if ($env:COMPUTERNAME -ine 'SWVMNVMNPDDEP01') {
            throw "Refusing to deploy from unexpected host: $env:COMPUTERNAME"
          }

          $publishRoot = 'C:\ProgramData\SparkFinance\publish'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'finance-backend-release'
          $services = @(
            'AccountingService.API',
            'BankingService.API',
            'BillService.API',
            'ClientService.API',
            'DashboardService.API',
            'ExchangeRateService.API',
            'ExpenseService.API',
            'PaymentMadeService.API',
            'PurchaseOrderService.API',
            'RoleService.API',
            'PermissionService.API',
            'SalesEstimateService.API',
            'SalesInvoiceService.API',
            'VendorCreditService.API',
            'VendorService.API'
          )

          $offlineFiles = @()
          $restartFailures = @()
          $replacedFiles = @()
          $backupRoot = Join-Path 'C:\ProgramData\SparkFinance\deploy-backups' $env:GITHUB_RUN_ID
          $deploymentError = $null

          try {
            foreach ($service in $services) {
              $target = Join-Path $publishRoot $service
              $offlinePath = Join-Path $target 'app_offline.htm'
              Set-Content -LiteralPath $offlinePath -Value 'Deployment in progress' -Encoding UTF8 -ErrorAction Stop
              $offlineFiles += $offlinePath
            }
            Start-Sleep -Seconds 5

            foreach ($service in $services) {
              $source = Join-Path $outputRoot $service
              $target = Join-Path $publishRoot $service
              $files = Get-ChildItem -LiteralPath $source -Recurse -File

              foreach ($file in $files) {
                if ($file.Name -eq 'web.config' -or $file.Name -like 'appsettings*.json') {
                  continue
                }

                $relative = $file.FullName.Substring($source.Length).TrimStart('\')
                $destination = Join-Path $target $relative
                $destinationDirectory = Split-Path -Parent $destination

                if (Test-Path -LiteralPath $destination) {
                  $backupPath = Join-Path (Join-Path $backupRoot $service) $relative
                  New-Item -ItemType Directory -Path (Split-Path -Parent $backupPath) -Force | Out-Null
                  Copy-Item -LiteralPath $destination -Destination $backupPath -Force
                  $replacedFiles += [PSCustomObject]@{
                    Destination = $destination
                    Backup = $backupPath
                  }
                }

                New-Item -ItemType Directory -Path $destinationDirectory -Force | Out-Null
                Copy-Item -LiteralPath $file.FullName -Destination $destination -Force
              }
            }
          }
          catch {
            $deploymentError = $_
            foreach ($record in $replacedFiles) {
              try {
                Copy-Item -LiteralPath $record.Backup -Destination $record.Destination -Force
              }
              catch {
                $restartFailures += "Rollback failed for $($record.Destination)"
              }
            }
          }
          finally {
            foreach ($offlinePath in $offlineFiles) {
              try {
                Remove-Item -LiteralPath $offlinePath -Force -ErrorAction Stop
              }
              catch {
                $restartFailures += "Could not remove offline marker $offlinePath"
              }
            }
          }

          if ($null -ne $deploymentError) {
            throw "Backend deployment failed and was rolled back where possible: $($deploymentError.Exception.Message)"
          }

          if ($restartFailures.Count -gt 0) {
            throw ($restartFailures -join '; ')
          }

          Write-Host "Published backend commit $env:GITHUB_SHA to $publishRoot"

      - name: Verify Roles and Permissions APIs
        run: |
          $endpoints = @(
            'http://127.0.0.1/api/role',
            'http://127.0.0.1/api/permissions'
          )

          foreach ($endpoint in $endpoints) {
            $verified = $false
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $endpoint -UseBasicParsing -TimeoutSec 20
                if ($response.StatusCode -eq 200 -and $response.Headers['Content-Type'] -match 'application/json') {
                  $verified = $true
                  break
                }
              }
              catch {
                Start-Sleep -Seconds 5
              }
            }
            if (-not $verified) { throw "API smoke check failed: $endpoint" }
          }

          $anonymousSession = Invoke-WebRequest -Uri 'http://127.0.0.1/api/development-admin/session' -UseBasicParsing -TimeoutSec 20
          if ($anonymousSession.StatusCode -ne 204) {
            throw "Anonymous session check returned $($anonymousSession.StatusCode) instead of 204."
          }

          try {
            $response = Invoke-WebRequest -Uri 'http://127.0.0.1/api/role-permissions/1' -UseBasicParsing -TimeoutSec 20
            throw "Unauthenticated role permissions returned $($response.StatusCode)"
          }
          catch {
            if ([int]$_.Exception.Response.StatusCode -ne 401) { throw }
          }
